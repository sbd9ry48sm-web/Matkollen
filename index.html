<style>

/* ===== MATKOLLEN DESIGN SYSTEM ===== */
:root {
  color-scheme: dark;
  --mk-bg: #050b09;
  --mk-bg-soft: #08130f;
  --mk-surface: #0b1914;
  --mk-surface-2: #10231b;
  --mk-surface-3: #153026;
  --mk-border: rgba(74, 231, 126, .19);
  --mk-border-strong: rgba(74, 231, 126, .42);
  --mk-green: #45e87a;
  --mk-green-2: #20c965;
  --mk-green-deep: #07351d;
  --mk-text: #f4faf6;
  --mk-muted: #a8bbb0;
  --mk-dim: #71877a;
  --mk-danger: #ff655f;
  --mk-warning: #ffc857;
  --mk-ok: #55df8a;
  --mk-radius-sm: 12px;
  --mk-radius: 18px;
  --mk-radius-lg: 24px;
  --mk-shadow: 0 14px 36px rgba(0,0,0,.24);
  --mk-page-width: 760px;
  --mk-safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--mk-bg); scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 10% 0%, rgba(23, 97, 55, .15), transparent 34rem),
    var(--mk-bg);
  color: var(--mk-text);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: var(--mk-green); }
img { max-width: 100%; }
.mk-app { width: 100%; max-width: var(--mk-page-width); min-height: 100dvh; margin: 0 auto; padding-bottom: calc(86px + var(--mk-safe-bottom)); }
.mk-page { padding: 18px 16px 26px; }
.mk-hidden { display: none !important; }

/* Type and shared layout */
.mk-eyebrow { color: var(--mk-green); font-size: .75rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
.mk-title { margin: 5px 0 8px; font-size: clamp(1.65rem, 6vw, 2.15rem); line-height: 1.12; letter-spacing: -.045em; font-weight: 820; }
.mk-subtitle { margin: 0; color: var(--mk-muted); line-height: 1.5; font-size: .94rem; }
.mk-section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin: 25px 0 12px; }
.mk-section-head h2 { margin:0; font-size:1.08rem; letter-spacing:-.02em; }
.mk-link { color:var(--mk-green); background:none; border:0; padding:8px 0; font-size:.82rem; font-weight:750; text-decoration:none; cursor:pointer; }
.mk-row { display:flex; align-items:center; gap:12px; }
.mk-between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.mk-stack { display:grid; gap:12px; }
.mk-muted { color:var(--mk-muted); }
.mk-small { font-size:.78rem; }
.mk-divider { height:1px; border:0; background:var(--mk-border); margin:16px 0; }

/* Header */
.mk-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 16px 16px 8px; }
.mk-brand { display:flex; align-items:center; gap:9px; color:var(--mk-text); font-weight:850; font-size:1.12rem; letter-spacing:-.04em; }
.mk-leaf { display:inline-grid; place-items:center; width:30px; height:30px; color:var(--mk-green); font-size:1.35rem; }
.mk-icon-btn { display:grid; place-items:center; width:42px; height:42px; border:1px solid var(--mk-border); border-radius:15px; background:rgba(10,28,20,.85); color:var(--mk-text); cursor:pointer; font-size:1.1rem; }
.mk-icon-btn:focus-visible, .mk-btn:focus-visible, .mk-nav-item:focus-visible { outline:2px solid var(--mk-green); outline-offset:3px; }

/* Buttons */
.mk-btn { display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:48px; padding:13px 18px; border:1px solid transparent; border-radius:999px; background:linear-gradient(110deg, #52ed83, #24ce68); color:#052311; font-weight:800; text-decoration:none; text-align:center; cursor:pointer; box-shadow:0 7px 22px rgba(37,211,102,.13); transition:transform .15s ease, filter .15s ease; }
.mk-btn:active { transform:scale(.985); }
.mk-btn-block { width:100%; }
.mk-btn-secondary { color:var(--mk-text); background:rgba(12,29,21,.8); border-color:var(--mk-border-strong); box-shadow:none; }
.mk-btn-quiet { color:var(--mk-green); background:transparent; box-shadow:none; }
.mk-btn:disabled { opacity:.48; cursor:not-allowed; }

/* Cards and chips */
.mk-card { background:linear-gradient(145deg, rgba(16,37,28,.97), rgba(7,20,14,.98)); border:1px solid var(--mk-border); border-radius:var(--mk-radius); box-shadow:var(--mk-shadow); overflow:hidden; }
.mk-card-pad { padding:15px; }
.mk-chip { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:31px; padding:6px 12px; border:1px solid var(--mk-border); border-radius:999px; background:#0b1c14; color:var(--mk-muted); font-size:.78rem; font-weight:700; white-space:nowrap; }
.mk-chip-active { background:var(--mk-green); color:#052311; border-color:var(--mk-green); }
.mk-badge { display:inline-flex; align-items:center; padding:5px 9px; border-radius:999px; font-size:.72rem; font-weight:800; white-space:nowrap; }
.mk-badge-danger { background:rgba(255,101,95,.16); color:#ff827b; }
.mk-badge-warning { background:rgba(255,200,87,.16); color:#ffd36d; }
.mk-badge-ok { background:rgba(69,232,122,.13); color:#6cf098; }

/* Product rows */
.mk-product-list { display:grid; gap:9px; }
.mk-product { display:flex; align-items:center; gap:12px; min-width:0; padding:11px; border:1px solid rgba(74,231,126,.13); border-radius:16px; background:rgba(5,17,12,.7); }
.mk-product-img { flex:0 0 54px; width:54px; height:54px; display:grid; place-items:center; overflow:hidden; border-radius:13px; background:linear-gradient(145deg,#173d29,#0b2016); font-size:1.7rem; }
.mk-product-img img { width:100%; height:100%; object-fit:cover; }
.mk-product-info { flex:1; min-width:0; }
.mk-product-info strong { display:block; font-size:.92rem; margin-bottom:4px; }
.mk-product-info p { margin:0; color:var(--mk-muted); font-size:.77rem; line-height:1.4; }
.mk-product-side { display:grid; justify-items:end; gap:6px; }

/* Home hero */
.mk-hero { position:relative; overflow:hidden; min-height:205px; padding:20px; border-radius:var(--mk-radius-lg); border:1px solid var(--mk-border); background:radial-gradient(ellipse at 85% 10%,rgba(57,210,103,.22),transparent 45%), linear-gradient(135deg,#102d1e,#06100b 75%); }
.mk-hero h1 { max-width:290px; margin:0 0 9px; font-size:1.8rem; line-height:1.08; letter-spacing:-.05em; }
.mk-hero p { max-width:280px; color:#c0d0c5; margin:0 0 18px; font-size:.9rem; line-height:1.5; }
.mk-hero-art { position:absolute; right:-22px; top:10px; width:45%; max-width:190px; opacity:.72; pointer-events:none; mask-image:linear-gradient(to left,black 65%,transparent); }
.mk-hero .mk-btn { position:relative; z-index:1; }

/* Recipe cards */
.mk-recipe-grid { display:grid; grid-template-columns:1fr; gap:12px; }
.mk-recipe { overflow:hidden; border:1px solid var(--mk-border); border-radius:19px; background:var(--mk-surface); }
.mk-recipe-img { position:relative; height:165px; background:linear-gradient(135deg,#183b28,#0b1a12); overflow:hidden; }
.mk-recipe-img img { width:100%; height:100%; object-fit:cover; }
.mk-recipe-img .mk-badge { position:absolute; left:10px; top:10px; background:rgba(3,20,11,.86); color:var(--mk-green); }
.mk-recipe-body { padding:13px; }
.mk-recipe-body h3 { margin:0 0 6px; font-size:1rem; }
.mk-recipe-body p { margin:0; color:var(--mk-muted); font-size:.82rem; line-height:1.45; }
.mk-recipe-meta { display:flex; gap:14px; color:var(--mk-muted); font-size:.76rem; margin-top:10px; }

/* Search and form controls */
.mk-search { position:relative; margin:14px 0; }
.mk-search input { width:100%; min-height:46px; padding:12px 14px 12px 42px; color:var(--mk-text); background:#0b1b14; border:1px solid var(--mk-border); border-radius:999px; outline:none; }
.mk-search::before { content:"⌕"; position:absolute; left:15px; top:7px; color:var(--mk-muted); font-size:1.5rem; }
.mk-search input:focus, .mk-field input:focus, .mk-field select:focus, .mk-field textarea:focus { border-color:var(--mk-green); box-shadow:0 0 0 3px rgba(69,232,122,.1); outline:none; }
.mk-field { display:grid; gap:7px; margin:14px 0; }
.mk-field label { color:#d8e7dd; font-size:.82rem; font-weight:700; }
.mk-field input, .mk-field select, .mk-field textarea { width:100%; min-height:48px; padding:12px 14px; border:1px solid var(--mk-border); border-radius:14px; color:var(--mk-text); background:#07150f; }
.mk-field textarea { min-height:92px; resize:vertical; }
.mk-help { color:var(--mk-muted); font-size:.75rem; line-height:1.45; }

/* Scanner frame: keep existing scanner library/container and its JS IDs */
.mk-scanner-shell { position:relative; overflow:hidden; min-height:360px; border:1px solid var(--mk-border-strong); border-radius:24px; background:#020806; }
.mk-scanner-shell video, .mk-scanner-shell canvas { width:100% !important; height:auto !important; object-fit:cover; }
.mk-scan-guide { position:absolute; inset:22% 12%; border:2px solid var(--mk-green); border-radius:20px; box-shadow:0 0 0 999px rgba(0,0,0,.25),0 0 28px rgba(69,232,122,.16); pointer-events:none; }
.mk-scan-guide::after { content:""; position:absolute; left:10%; right:10%; top:50%; height:2px; background:var(--mk-green); box-shadow:0 0 12px var(--mk-green); }
.mk-scan-hint { color:var(--mk-muted); text-align:center; font-size:.85rem; line-height:1.45; margin:12px 0 18px; }

/* Notifications and settings */
.mk-setting-row { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--mk-border); }
.mk-setting-row:last-child { border-bottom:0; }
.mk-setting-icon { display:grid; place-items:center; flex:0 0 40px; width:40px; height:40px; border-radius:14px; color:var(--mk-green); background:#10291c; }
.mk-setting-copy { flex:1; min-width:0; }
.mk-setting-copy strong { display:block; font-size:.88rem; }
.mk-setting-copy p { margin:4px 0 0; color:var(--mk-muted); font-size:.76rem; line-height:1.4; }
.mk-switch { appearance:none; width:44px; height:26px; flex:0 0 44px; border-radius:999px; background:#33483b; position:relative; cursor:pointer; transition:background .15s; }
.mk-switch::after { content:""; position:absolute; width:20px; height:20px; top:3px; left:3px; background:#fff; border-radius:50%; transition:transform .15s; }
.mk-switch:checked { background:var(--mk-green-2); }
.mk-switch:checked::after { transform:translateX(18px); background:#052311; }

/* Bottom navigation — preserve existing routes/handlers when integrating */
.mk-bottom-nav { position:fixed; z-index:50; bottom:0; left:50%; transform:translateX(-50%); width:min(100%, var(--mk-page-width)); display:grid; grid-template-columns:repeat(4,1fr); padding:9px 8px calc(9px + var(--mk-safe-bottom)); background:rgba(4,13,9,.94); backdrop-filter:blur(18px); border-top:1px solid var(--mk-border); }
.mk-nav-item { display:grid; justify-items:center; align-content:center; gap:4px; min-height:48px; color:var(--mk-dim); background:transparent; border:0; border-radius:13px; font-size:.68rem; font-weight:700; cursor:pointer; text-decoration:none; }
.mk-nav-icon { font-size:1.15rem; line-height:1; }
.mk-nav-item[aria-current="page"], .mk-nav-item.is-active { color:var(--mk-green); }
.mk-nav-item[aria-current="page"] .mk-nav-icon, .mk-nav-item.is-active .mk-nav-icon { filter:drop-shadow(0 0 7px rgba(69,232,122,.25)); }

/* Five-step onboarding design shell */
.mk-onboarding { min-height:100dvh; display:flex; flex-direction:column; padding:18px 20px calc(22px + var(--mk-safe-bottom)); background:radial-gradient(ellipse at 50% 12%,rgba(29,112,58,.22),transparent 45%),var(--mk-bg); }
.mk-onboard-progress { align-self:center; color:var(--mk-green); border:1px solid var(--mk-border-strong); border-radius:999px; padding:6px 12px; font-size:.78rem; margin:4px 0 20px; }
.mk-onboard-content { flex:1; display:flex; flex-direction:column; justify-content:center; }
.mk-onboard-art { width:100%; max-height:34vh; object-fit:cover; border-radius:22px; margin:18px 0; mask-image:linear-gradient(to bottom,black 72%,transparent); }
.mk-onboard-content h1 { margin:0 0 12px; font-size:clamp(1.8rem,7vw,2.45rem); line-height:1.08; letter-spacing:-.045em; }
.mk-onboard-content p { color:var(--mk-muted); font-size:.98rem; line-height:1.6; margin:0; }
.mk-onboard-footer { display:grid; gap:13px; margin-top:20px; }
.mk-onboard-controls { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.mk-dots { display:flex; align-items:center; justify-content:center; gap:8px; }
.mk-dot { width:8px; height:8px; border-radius:50%; background:#244236; border:0; padding:0; }
.mk-dot.is-active { width:22px; border-radius:99px; background:var(--mk-green); }
.mk-onboard-arrow { width:42px; height:42px; border-radius:50%; border:1px solid var(--mk-border-strong); background:transparent; color:var(--mk-green); font-size:1.15rem; cursor:pointer; }

/* Empty, success, error states */
.mk-empty { padding:28px 18px; text-align:center; border:1px dashed var(--mk-border-strong); border-radius:18px; color:var(--mk-muted); }
.mk-empty-icon { font-size:2rem; margin-bottom:8px; }
.mk-alert { padding:12px 14px; border:1px solid var(--mk-border); border-radius:14px; background:var(--mk-surface); color:var(--mk-muted); font-size:.84rem; line-height:1.45; }
.mk-alert-error { border-color:rgba(255,101,95,.35); color:#ffaaa5; }
.mk-alert-success { border-color:rgba(69,232,122,.3); color:#8cf3ad; }

/* Larger screens */
@media (min-width:560px) {
  .mk-page { padding:22px 22px 30px; }
  .mk-header { padding-left:22px; padding-right:22px; }
  .mk-recipe-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .mk-hero { min-height:230px; padding:24px; }
}
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; }
}

.mk-avatar{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;border:2px solid var(--mk-green);background:#10291c;font-size:2.4rem;box-shadow:0 0 24px rgba(69,232,122,.25)}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.mk-recipe-img{background:linear-gradient(135deg,#1c4a31,#0b1a12)}
.mk-hero{padding-right:128px!important}.mk-hero h1,.mk-hero p{max-width:100%}

.actions .btn,.actions .btn--ghost{min-height:40px;padding:8px 14px;font-size:.85rem}
.mk-recipe-img{height:104px}

function render(){

$("#nav").innerHTML=TABS.map(([k,l])=>`<button data-go="${k}" ${st.tab===k?'aria-current="page"':""}>${ICONS[k]}<span>${l}</span></button>`).join("");

function toast(t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

document.addEventListener("click",async e=>{
const b=e.target.closest("[data-go],[data-act],[data-cat],[data-fav]");if(!b)return;
const D=b.dataset,id=D.id;
if(D.go){st.tab=D.go;st.recipe=null;st.adding=false;window.scrollTo(0,0)}
else if(D.cat){st.cat=D.cat}
else if(D.fav){st.onlyFav=D.fav==="1";st.onlySoon=D.fav==="2"}
else if(D.act==="gofavs"){st.tab="recipe";st.recipe=null;st.onlyFav=true;st.onlySoon=false}
else if(D.act==="add"){window.scrollTo(0,0);st.tab="fridge";st.adding=true;st.prefill=null}
else if(D.act==="scan"){openScan();return}
else if(D.act==="closescan"){closeScan();return}
else if(D.act==="demo"){await addDemo()}
else if(D.act==="reset"){if(!confirm("Ta bort alla dina varor?"))return;await deleteAll()}
else if(D.act==="logout"){try{await sb.auth.signOut()}catch(x){}setUser(null);items=[];st.tab="scan";window.scrollTo(0,0)}
else if(D.act==="delacct"){if(!confirm("Vill du ta bort ditt konto och alla dina varor för alltid? Det går inte att ångra."))return;if(!await deleteAccount())return;st.tab="scan";window.scrollTo(0,0)}
else if(D.act==="onbnext"){st.onb=Math.min(ONB.length-1,st.onb+1)}
else if(D.act==="onbprev"){st.onb=Math.max(0,st.onb-1)}
else if(D.act==="onbskip"||D.act==="onbsignup"||D.act==="onblogin"){st.onbDone=true;try{localStorage.setItem("mk_onb","1")}catch(x){}st.authMode=D.act==="onblogin"?"login":"signup";window.scrollTo(0,0)}
else if(D.act==="forgot"){st.authMode="forgot"}
else if(D.act==="tologin"){st.authMode="login"}
else if(D.act==="authmode"){st.authMode=st.authMode==="signup"?"login":"signup"}
else if(D.act==="cancel"){st.adding=false;st.prefill=null}
else if(D.act==="used"){const i=items.find(x=>x.id===id);if(i&&await removeItem(id))toast(i.name+" markerad som använd")}
else if(D.act==="del"){const i=items.find(x=>x.id===id);if(i&&await removeItem(id))toast(i.name+" borttagen")}
else if(D.act==="open"){st.recipe=+id;window.scrollTo(0,0)}
else if(D.act==="back"){st.recipe=null}
else if(D.act==="fav"){st.favs.has(st.recipe)?st.favs.delete(st.recipe):st.favs.add(st.recipe)}
render()});
document.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;fridgeList()}});
document.addEventListener("submit",async e=>{
const id=e.target.id;if(!["addForm","authForm","codeForm"].includes(id))return;e.preventDefault();
const f=new FormData(e.target);
if(id==="authForm"){await doAuth(e.target,f)}
else if(id==="codeForm"){onCode(f.get("c").trim())}
else{const c=f.get("c"),exp=new Date(f.get("d")+"T00:00:00").getTime();
const ok=await addItem({name:f.get("n").trim(),cat:c,exp,qty:(f.get("q")||"").trim()||"1 st",e:EMO[c]});
if(ok){st.adding=false;st.prefill=null;render();toast("Varan är sparad")}}});

const appUrl=()=>location.origin+location.pathname.replace(/index\.html$/,"");
function authErr(er){const m=(er.message||"").toLowerCase();
if(m.includes("invalid login"))return"Fel e-post eller lösenord.";
if(m.includes("already registered"))return"Det finns redan ett konto med den e-posten. Logga in istället.";
if(m.includes("at least"))return"Lösenordet måste vara minst 6 tecken.";
if(m.includes("not confirmed"))return"Bekräfta din e-post först. Öppna länken i mejlet vi skickade.";
if(m.includes("different"))return"Välj ett lösenord som skiljer sig från det gamla.";
if(m.includes("session"))return"Länken har gått ut. Gå tillbaka och be om en ny.";
if(m.includes("rate limit"))return"För många försök. Vänta en stund och försök igen.";
if(m.includes("invalid"))return"Kontrollera e-postadressen.";
return"Något gick fel: "+er.message}
async function doAuth(form,f){
const msg=$("#authMsg"),btn=form.querySelector("button[type=submit]");
const m=st.authMode,email=(f.get("e")||"").trim(),pw=f.get("p");
const say=(t,ok)=>{msg.textContent=t;msg.className=ok?"have":"miss"};
say("");btn.disabled=true;
try{
if(!sb){say("Inloggningen kunde inte laddas. Kontrollera nätverket.");return}
if(m==="forgot"){
const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:appUrl()});
if(error){say(authErr(error));return}
say("Om adressen finns hos oss har vi skickat en länk. Kolla din e-post, även skräpposten.",true);return}
if(m==="reset"){
const{data,error}=await sb.auth.updateUser({password:pw});
if(error){say(authErr(error));return}
setUser(data.user);await loadItems();st.authMode="login";st.tab="scan";window.scrollTo(0,0);render();toast("Ditt nya lösenord är sparat");return}
const res=m==="signup"?await sb.auth.signUp({email,password:pw,options:{data:{name:(f.get("n")||"").trim()},emailRedirectTo:appUrl()}}):await sb.auth.signInWithPassword({email,password:pw});
if(res.error){say(authErr(res.error));return}
const u=res.data.session?res.data.session.user:null;
if(!u){say("Vi har skickat ett mejl till "+email+". Öppna länken i mejlet och logga sedan in.",true);return}
setUser(u);await loadItems();st.tab="scan";window.scrollTo(0,0);render()
}catch(x){say("Något gick fel. Kontrollera nätverket och försök igen.")}
finally{btn.disabled=false}}

// Databas
const fromRow=r=>({id:r.id,name:r.name,cat:r.cat,qty:r.qty||"1 st",e:r.e||EMO[r.cat]||"🥫",exp:Number(r.exp),days:daysLeft(Number(r.exp))});
function setUser(u){userId=u?u.id:null;acct=u?{name:(u.user_metadata&&u.user_metadata.name)||"",email:u.email||""}:null}
async function loadItems(){const{data,error}=await sb.from("items").select("*").order("exp");if(error){toast("Kunde inte hämta dina varor.");return}items=data.map(fromRow)}
async function addItem(o){const{data,error}=await sb.from("items").insert(o).select().single();if(error){toast("Kunde inte spara varan. Försök igen.");return false}items.push(fromRow(data));return true}
async function removeItem(id){const{error}=await sb.from("items").delete().eq("id",id);if(error){toast("Något gick fel. Försök igen.");return false}items=items.filter(x=>x.id!==id);return true}
async function deleteAll(){const{error}=await sb.from("items").delete().eq("user_id",userId);if(error){toast("Något gick fel. Försök igen.");return}items=[];toast("Alla varor är borttagna")}
async function deleteAccount(){const{error}=await sb.rpc("delete_my_account");if(error){toast("Kunde inte ta bort kontot. Försök igen.");return false}try{await sb.auth.signOut({scope:"local"})}catch(x){}setUser(null);items=[];toast("Ditt konto är borttaget");return true}
async function addDemo(){const rows=DEMO.map(d=>({name:d.name,cat:d.cat,qty:d.qty,e:d.e,exp:addDays(d.days)}));const{data,error}=await sb.from("items").insert(rows).select();if(error){toast("Något gick fel. Försök igen.");return}items=items.concat(data.map(fromRow))}

async function openScan(){
busy=false;$("#scanBox").hidden=false;$("#reader").style.display="";
$("#scanMsg").textContent="Rikta kameran mot streckkoden på varan.";
try{
const F=Html5QrcodeSupportedFormats;
scanner=new Html5Qrcode("reader",{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false});
await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140}},c=>onCode(c),()=>{});
}catch(err){$("#reader").style.display="none";$("#scanMsg").textContent="Kameran kunde inte startas. Tillåt kamera för sidan i webbläsaren, eller skriv in streckkoden här under."}}
async function closeScan(){await stopCam();$("#scanBox").hidden=true}
function guess(tags){const t=tags.join(" ");
if(/dair|milk|chees|yogh|yogu|cream|butter|egg/.test(t))return"Mejeri";
if(/meat|poultry|chicken|beef|pork|sausage|fish/.test(t))return"Kött";
if(/vegetable|fruit|salad|plant-based-foods/.test(t))return"Grönsaker";
return"Annat"}
async function lookup(code){
try{const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+"?fields=product_name,product_name_sv,categories_tags,quantity");
const j=await r.json();
if(j.status===1&&j.product){const p=j.product;return{name:(p.product_name_sv||p.product_name||"").trim(),cat:guess(p.categories_tags||[]),qty:p.quantity||""}}}catch(x){}
return null}
async function onCode(code){
if(busy)return;busy=true;
$("#scanMsg").textContent="Letar efter varan…";
await stopCam();
const p=await lookup(code);
await closeScan();
st.tab="fridge";st.adding=true;st.prefill=p||{};
render();window.scrollTo(0,0);
toast(p&&p.name?"Hittade varan. Fyll i bäst före-datum.":"Hittade inte varan. Skriv in namnet själv.")}
(async()=>{
if(!sb){ready=true;render();toast("Kunde inte ladda inloggningen. Kontrollera nätverket.");return}
if(RECOVERY)st.authMode="reset";if(RECOVERY||LINKERR)st.onbDone=true;
try{const{data}=await sb.auth.getSession();if(data.session&&!RECOVERY){setUser(data.session.user);await loadItems()}}catch(x){}
ready=true;render();
if(LINKERR&&!acct){st.authMode="forgot";render();const mm=$("#authMsg");if(mm){mm.textContent="Länken har gått ut. Be om en ny här.";mm.className="miss"}}
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){setUser(null);items=[];render()}else if(ev==="PASSWORD_RECOVERY"){setUser(null);items=[];st.authMode="reset";render()}});
})();
</script>
</body>
</html>
