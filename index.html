<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matkollen – demo</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#E4EDF0;--card:#fff;--ink:#10242E;--mute:#566E7A;--line:#D3DEE3;--acc:#0F6B73;--onacc:#fff;--ok:#2B7A4B;--warn:#9A6700;--bad:#C0362E;--okbg:#E2F2E8;--warnbg:#FFF1CC;--badbg:#FBE3E0;--view:#0B1519;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1317;--card:#14262E;--ink:#E8F1F4;--mute:#92AAB5;--line:#254049;--acc:#4FC3CC;--onacc:#06242A;--ok:#7FD3A0;--warn:#F2C14E;--bad:#FF8F86;--okbg:#17352A;--warnbg:#3A3012;--badbg:#42201D;--view:#050B0E}}
:root[data-theme="dark"]{--bg:#0A1317;--card:#14262E;--ink:#E8F1F4;--mute:#92AAB5;--line:#254049;--acc:#4FC3CC;--onacc:#06242A;--ok:#7FD3A0;--warn:#F2C14E;--bad:#FF8F86;--okbg:#17352A;--warnbg:#3A3012;--badbg:#42201D;--view:#050B0E}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center}
.phone{width:100%;max-width:400px;height:100%;max-height:780px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:500px){.phone{border:1px solid var(--line);border-radius:28px;height:min(780px,96%)}}
header{padding:18px 20px 8px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
main{flex:1;overflow-y:auto;padding:8px 20px 20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.view{background:var(--view);border-radius:20px;height:260px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.view i{position:absolute;width:34px;height:34px;border:4px solid #fff;opacity:.9}
.view i:nth-child(1){top:40px;left:40px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.view i:nth-child(2){top:40px;right:40px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.view i:nth-child(3){bottom:40px;left:40px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.view i:nth-child(4){bottom:40px;right:40px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.view b{position:absolute;left:44px;right:44px;height:2px;background:#FF5A4D;animation:sc 2.4s ease-in-out infinite alternate}
@keyframes sc{from{top:60px}to{top:196px}}
@media (prefers-reduced-motion:reduce){.view b{animation:none;top:128px}}
.view span{color:#fff;opacity:.7;font-size:14px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:600;font-size:16px;background:var(--acc);color:var(--onacc);margin-top:14px}
.btn.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.av{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.btn.dark{background:var(--ink);color:var(--bg)}
ol{padding-left:20px;margin:0}ol li{margin-bottom:8px;font-size:15px;line-height:1.4}
.mut{color:var(--mute);font-size:13px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin:12px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.prod{display:flex;gap:14px;align-items:center}
.ico{width:56px;height:56px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.prod h2{margin:0;font-size:18px}
.prod p{margin:2px 0 0;color:var(--mute);font-size:13px}
.lbl{font-size:14px;font-weight:600;margin:18px 0 8px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--acc)}
input[type=date],input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:20px}
.step output{min-width:28px;text-align:center;font-weight:800;font-size:18px}
.info{background:var(--okbg);color:var(--ok);border-radius:12px;padding:12px;font-size:14px;font-weight:600}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:10px 0;font-size:14px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;padding:12px 0 14px;font-size:13px;font-weight:600;color:var(--mute)}
nav button[aria-current=page]{color:var(--acc)}
nav span{display:block;font-size:20px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .t{flex:1;min-width:0}
.item strong{display:block;font-size:15px}
.item small{color:var(--mute)}
.chip{font-size:12px;font-weight:700;border-radius:99px;padding:5px 10px;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
.use{border:1.5px solid var(--line);background:none;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
#t{position:absolute;left:20px;right:20px;bottom:84px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#t.on{opacity:1}
</style>
</head>
<body>
<div class="phone">
<header><h1 id="h">Skanna vara</h1><p class="sub" id="s"></p></header>
<main id="m"></main>
<nav><button id="n1" onclick="go('scan')"><span>▣</span>Skanna</button><button id="n2" onclick="go('list')"><span>❄</span>Kylskåp</button><button id="nr" onclick="go('rec')"><span>♨</span>Recept</button><button id="n3" onclick="go('prof')"><span>☺</span>Profil</button></nav>
<div id="t" role="status"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const add=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const fmt=d=>d.toLocaleDateString('sv-SE',{day:'numeric',month:'short'});
const diff=d=>Math.round((d-add(0))/864e5);
const P=[
{n:'Mjölk 1,5 %',b:'Arla · 1 l',e:'7310865001061',d:7,i:'🥛',u:0},
{n:'Kycklingfilé',b:'Kronfågel · 900 g',e:'7350012345678',d:3,i:'🍗',u:0},
{n:'Okänd produkt',b:'Streckkoden finns inte i databasen',e:'7300000000017',d:5,i:'❓',u:1},
{n:'Pasta Penne',b:'Barilla · 500 g',e:'8076802085738',d:365,i:'🍝',u:0,s:'Skafferi'},
{n:'Yoghurt naturell',b:'Valio · 1 kg',e:'6408430000213',d:14,i:'🥣',u:0}];
let k=0,cur=null,stor='Kyl',qty=1,exact='',nameVal='',tab='scan';
const seed=()=>[{n:'Gurka',i:'🥒',st:'Kyl',q:1,date:add(1)},{n:'Ägg 12-pack',i:'🥚',st:'Kyl',q:1,date:add(9)}];
let items=[],user=null,step='welcome',notif=true,when=2,via='',draft='',mail='';
try{const u=JSON.parse(localStorage.getItem('mk')||'null');if(u&&u.name){user=u.name;notif=u.notif;when=u.when;via=u.via||'';step='done'}}catch(e){}
function persist(){try{if(user)localStorage.setItem('mk',JSON.stringify({name:user,notif,when,via}));else localStorage.removeItem('mk')}catch(e){}}
try{items=JSON.parse(localStorage.getItem('mk_items')||'[]').map(x=>({...x,date:new Date(x.date)}))}catch(e){items=[]}
let names={};try{names=JSON.parse(localStorage.getItem('mk_names')||'{}')}catch(e){}
function saveItems(){try{localStorage.setItem('mk_items',JSON.stringify(items))}catch(e){}}
let stream=null,rd=null;
function stopCam(){if(stream&&stream.getTracks)stream.getTracks().forEach(t=>t.stop());stream=null;if(rd){try{rd.reset()}catch(e){}rd=null}}
async function startCam(){
 const v=$('#vid');if(!v)return;
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
  if('BarcodeDetector' in window){
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
   if(!$('#vid')){stopCam();return}
   v.srcObject=stream;await v.play();
   const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});
   const loop=async()=>{if(!stream)return;try{const c=await det.detect(v);if(c.length){found(c[0].rawValue);return}}catch(e){}setTimeout(loop,250)};loop();
  }else if(window.ZXing){
   rd=new ZXing.BrowserMultiFormatReader();
   await rd.decodeFromVideoDevice(null,'vid',r=>{if(r)found(r.getText())});
  }else throw 0;
  const n=$('#camnote');if(n)n.textContent='';
 }catch(e){stopCam();const n=$('#camnote');if(n)n.textContent='Kameran kunde inte startas. Skriv in streckkoden nedan eller prova en exempelvara.'}
}
function begin(c){stopCam();cur=c;stor=c.s||'Kyl';qty=1;exact='';nameVal='';render()}
let busy=false;
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function found(code){code=String(code).trim();if(busy)return;busy=true;stopCam();
 if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
 const b=P.find(p=>p.e===code),sv=names[code];
 if(b){busy=false;return begin({...b})}
 if(sv){busy=false;return begin({n:sv.n,b:sv.b||'Sparad av dig',e:code,i:'🛒',u:0,img:sv.img})}
 toast('Söker produkten…');
 let c={n:'Okänd produkt',b:'Hittades inte i Open Food Facts. Skriv in namnet så minns appen det.',e:code,i:'❓',u:1};
 try{
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),7000);
  const res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,quantity,image_front_small_url',{signal:ctl.signal});
  clearTimeout(t);
  const j=await res.json(),p=j&&j.product;
  if(j&&j.status===1&&p&&p.product_name){
   const img=/^https:\/\//.test(p.image_front_small_url||'')?esc(p.image_front_small_url):'';
   c={n:esc(p.product_name),b:esc([(p.brands||'').split(',')[0].trim(),p.quantity].filter(Boolean).join(' · '))||'Open Food Facts',e:code,i:'🛒',u:0,img};
   names[code]={n:c.n,b:c.b,img};try{localStorage.setItem('mk_names',JSON.stringify(names))}catch(e){}
  }
 }catch(e){c.b='Kunde inte nå produktdatabasen. Skriv in namnet så minns appen det.'}
 busy=false;begin(c)}
function manual(){const v=$('#bc').value.replace(/\D/g,'');if(v.length<8){toast('Streckkoder har 8 eller 13 siffror');return}found(v)}
const WH=[['2 dagar före',2],['1 dag före',1],['Samma dag',0]];
function nameOk(){const v=$('#un').value.trim();if(!v){toast('Skriv ditt namn först');$('#un').focus();return null}return v}
function withApple(){const v=nameOk();if(!v)return;user=v;via='Apple';step='notif';persist();render();toast('Verifierad med Apple')}
function withMail(){const v=nameOk();if(!v)return;draft=v;step='email';render()}
function sendCode(){const v=$('#em').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('Skriv en giltig e-postadress');$('#em').focus();return}mail=v;step='code';render();toast('Kod skickad till '+v)}
function verify(){const c=$('#cd').value.replace(/\D/g,'');if(c.length!==6){toast('Skriv koden med 6 siffror');$('#cd').focus();return}user=draft;via=mail;step='notif';persist();render()}
function back(x){step=x;render()}
function setWhen(x){when=x;persist();render()}
function notifOn(x){if(x){try{Notification.requestPermission()}catch(e){}}notif=x;step='done';persist();render();toast(x?'Notiser på: vi påminner dig':'Notiser av. Du kan slå på dem under Profil')}
function toggleNotif(){notif=!notif;persist();render()}
function logout(){user=null;via='';draft='';mail='';step='welcome';cur=null;tab='scan';items=[];saveItems();persist();render()}
const whenSeg=()=>`<div class="seg">${WH.map(w=>`<button aria-pressed="${when===w[1]}" onclick="setWhen(${w[1]})">${w[0]}</button>`).join('')}</div>`;
let openR=null;
const R=[
{n:'Pannkakor',i:'🥞',t:'25 min',g:['ägg','mjölk'],x:'mjöl, smör, salt',s:['Vispa ihop ägg, mjölk och mjöl till en slät smet.','Låt smeten vila i 10 minuter.','Stek tunna pannkakor i smör på medelvärme.']},
{n:'Kycklingpasta',i:'🍝',t:'30 min',g:['kyckling','pasta','grädde'],x:'salt, peppar, olja',s:['Koka pastan enligt förpackningen.','Skär kycklingen i bitar och stek den i olja tills den är genomstekt.','Häll i grädden, smaka av med salt och peppar och vänd ner pastan.']},
{n:'Kycklingsallad med yoghurtdressing',i:'🥗',t:'20 min',g:['kyckling','gurka','yoghurt'],x:'salt, peppar, olja',s:['Stek kycklingen i olja och låt den svalna lite.','Skiva gurkan och lägg den på tallriken.','Rör ihop yoghurt, salt och peppar till en dressing och lägg på kycklingen.']},
{n:'Tzatziki',i:'🥒',t:'10 min',g:['gurka','yoghurt'],x:'vitlök, salt, olja',s:['Riv gurkan och krama ut vätskan.','Blanda med yoghurt, pressad vitlök, salt och en skvätt olja.','Låt stå kallt en stund innan servering.']},
{n:'Äggpasta',i:'🍳',t:'15 min',g:['pasta','ägg'],x:'smör, salt, peppar',s:['Koka pastan och spara lite av kokvattnet.','Stek äggen i smör.','Vänd pastan med smör och lite kokvatten och lägg äggen ovanpå.']}];
function info(r){const m=r.g.map(k=>({k,x:items.find(x=>x.n.toLowerCase().includes(k))}));const have=m.filter(a=>a.x);const miss=m.filter(a=>!a.x).map(a=>a.k);const urg=have.reduce((t,a)=>{const d=diff(a.x.date);return t+(d<=1?3:d<=3?2:1)},0);const soon=have.length?have.reduce((a,b)=>a.x.date<=b.x.date?a:b):null;return{m,have,miss,urg,soon}}
function openRec(i){openR=i;render()}
function cook(i){info(R[i]).have.forEach(a=>{const j=items.indexOf(a.x);if(j<0)return;if(items[j].q>1)items[j].q--;else items.splice(j,1)});openR=null;saveItems();render();toast('Bra! Ingredienserna är borttagna från kylskåpet')}
function toast(x){const t=$('#t');t.textContent=x;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function go(x){tab=x;cur=null;openR=null;render()}
function scan(){begin({...P[k%P.length]});k++}
function setStor(x){stor=x;render()}
function chg(n){qty=Math.max(1,qty+n);render()}
function save(){
 const v=$('#dt').value;
 if(!v){toast('Fyll i bäst före-datum först');$('#dt').focus();return}
 const name=cur.u?($('#nm').value.trim()||'Okänd vara'):cur.n;
 const date=new Date(v+'T00:00:00');
 items.push({n:name,i:cur.u?'🛒':cur.i,st:stor,q:qty,date});if(cur.u){names[cur.e]={n:name};try{localStorage.setItem('mk_names',JSON.stringify(names))}catch(e){}}saveItems();
 toast(name+' sparad. Redo för nästa vara.');cur=null;render()}
function use(x){items.splice(x,1);saveItems();render();toast('Borttagen från listan')}
function chip(n){const c=n<=1?'bad':n<=3?'warn':'ok';const t=n<0?'Utgånget':n===0?'Går ut idag':n===1?'Går ut imorgon':'Om '+n+' dagar';return `<span class="chip ${c}">${t}</span>`}
function render(){
 stopCam();
 const e=$('#dt');if(e)exact=e.value;const q=$('#nm');if(q)nameVal=q.value;
 $('nav').style.display=user&&step==='done'?'flex':'none';
 const m=$('#m');
 const u0=$('#un');if(u0)draft=u0.value;
 if(!user){
  if(step==='email'){
   $('#h').textContent='Verifiera med e-post';$('#s').textContent='Vi skickar en kod till din e-post';
   m.innerHTML=`<div class="lbl">E-postadress</div><input id="em" type="email" value="${mail}" placeholder="namn@exempel.se" autocomplete="email" aria-label="E-postadress" onkeydown="if(event.key==='Enter')sendCode()">
   <button class="btn" onclick="sendCode()">Skicka kod</button><button class="btn alt" style="margin-top:10px" onclick="back('welcome')">Tillbaka</button>`;return}
  if(step==='code'){
   $('#h').textContent='Skriv koden';$('#s').textContent='Vi skickade en 6-siffrig kod till '+mail;
   m.innerHTML=`<div class="lbl">Kod</div><input id="cd" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code" aria-label="Kod från e-post" onkeydown="if(event.key==='Enter')verify()">
   <button class="btn" onclick="verify()">Verifiera</button><button class="link" style="width:100%" onclick="toast('Ny kod skickad')">Skicka ny kod</button><button class="btn alt" onclick="back('email')">Byt e-postadress</button><p class="hint">I demon fungerar vilken 6-siffrig kod som helst.</p>`;return}
  $('#h').textContent='Välkommen till Matkollen';$('#s').textContent='Skapa ditt konto';
  m.innerHTML=`<div class="card"><p style="margin:0 0 4px;font-weight:600">Slut på bortkastad mat</p><p class="sub" style="margin:0">Skanna det du handlat, fyll i bäst före-datum och få en påminnelse innan det går ut.</p></div>
  <div class="lbl">Vad heter du?</div><input id="un" type="text" value="${draft}" placeholder="Ditt namn" autocomplete="name" aria-label="Ditt namn">
  <p class="hint" style="text-align:left;margin:8px 0 0">Namnet visas bara för dig i appen.</p>
  <div class="lbl">Verifiera ditt konto med</div>
  <button class="btn dark" style="margin-top:0" onclick="withApple()">Fortsätt med Apple</button><button class="btn alt" style="margin-top:10px" onclick="withMail()">Fortsätt med e-post</button><p class="hint">Demo: ingen e-post skickas och inget lämnar din telefon.</p>`;return}
 if(step==='notif'){
  $('#h').textContent='Hej '+user+'!';$('#s').textContent='Ditt konto är skapat';
  m.innerHTML=`<div class="card"><p style="margin:0 0 4px;font-weight:600">Vill du få notiser?</p><p class="sub" style="margin:0">Vi skickar en påminnelse när något snart går ut, så att du hinner använda det.</p></div>
  <div class="lbl">När vill du bli påmind?</div>${whenSeg()}
  <button class="btn" onclick="notifOn(true)">Slå på notiser</button><button class="btn alt" style="margin-top:10px" onclick="notifOn(false)">Inte nu</button>`;return}
 $('#nr').setAttribute('aria-current',tab==='rec'?'page':'false');$('#n3').setAttribute('aria-current',tab==='prof'?'page':'false');
 $('#n1').setAttribute('aria-current',tab==='scan'?'page':'false');
 $('#n2').setAttribute('aria-current',tab==='list'?'page':'false');
 if(tab==='rec'){
  $('#h').textContent='Recept';$('#s').textContent='Förslag på det du har hemma, det som går ut först överst';
  if(openR!==null){const r=R[openR],f=info(r);
   m.innerHTML=`<div class="card"><div class="prod"><div class="ico">${r.i}</div><div><h2>${r.n}</h2><p>${r.t}</p></div></div></div>
   <div class="lbl">Ingredienser</div><div class="card">${f.m.map(a=>`<div class="row" style="padding:6px 0"><span style="font-weight:600">${a.k[0].toUpperCase()+a.k.slice(1)}</span>${a.x?chip(diff(a.x.date)):'<span class="mut">Saknas</span>'}</div>`).join('')}<p class="mut" style="margin:8px 0 0">Basvaror: ${r.x}</p></div>
   <div class="lbl">Gör så här</div><div class="card"><ol>${r.s.map(x=>`<li>${x}</li>`).join('')}</ol></div>
   <button class="btn" onclick="cook(${openR})">Jag lagar detta</button><button class="btn alt" style="margin-top:10px" onclick="openRec(null)">Tillbaka till recepten</button>`;return}
  const L=R.map((r,i)=>({r,i,f:info(r)})).filter(o=>o.f.have.length).sort((a,b)=>(b.f.urg-b.f.miss.length*2)-(a.f.urg-a.f.miss.length*2));
  m.innerHTML=L.length?L.map(o=>`<button class="card" style="width:100%;text-align:left;margin-bottom:12px" onclick="openRec(${o.i})"><div class="prod"><div class="ico">${o.r.i}</div><div style="flex:1"><h2 style="font-size:16px">${o.r.n}</h2><p>${o.r.t} · Du har ${o.f.have.length} av ${o.r.g.length}</p></div></div><div class="row" style="margin-top:10px"><span class="mut">Använder ${o.f.soon.x.n}</span>${chip(diff(o.f.soon.x.date))}</div>${o.f.miss.length?`<p class="mut" style="margin:8px 0 0">Saknas: ${o.f.miss.join(', ')}</p>`:''}</button>`).join(''):'<p class="hint">Skanna några varor först, så föreslår vi vad du kan laga.</p>';return}
 if(tab==='prof'){
  $('#h').textContent='Profil';$('#s').textContent='Ditt konto och dina notiser';
  m.innerHTML=`<div class="card"><div class="prod"><div class="av">${user[0].toUpperCase()}</div><div><h2>${user}</h2><p>Verifierad med ${via||'e-post'}</p></div></div></div>
  <div class="lbl">Notiser</div><div class="row card"><span style="font-weight:600">${notif?'På':'Av'}</span><button class="use" onclick="toggleNotif()">${notif?'Slå av':'Slå på'}</button></div>
  ${notif?`<div class="lbl">Påminn mig</div>${whenSeg()}`:''}
  <button class="btn alt" style="margin-top:22px" onclick="logout()">Logga ut</button>`;return}
 if(tab==='list'){
  $('#h').textContent='Mitt kylskåp';$('#s').textContent=items.length+' varor, sorterade efter utgångsdatum';
  const s=[...items].sort((a,b)=>a.date-b.date);
  const soon=items.filter(x=>diff(x.date)<=when);const ban=notif&&soon.length?`<div class="info" style="margin-bottom:12px;background:var(--warnbg);color:var(--warn)">Påminnelse: ${soon.map(x=>x.n).join(', ')} går ut snart</div>`:'';
  m.innerHTML=ban+(s.length?`<div class="card">${s.map(x=>`<div class="item"><div class="ico" style="width:44px;height:44px;font-size:24px">${x.i}</div><div class="t"><strong>${x.n}${x.q>1?' ×'+x.q:''}</strong><small>${x.st} · ${fmt(x.date)}</small></div>${chip(diff(x.date))}<button class="use" onclick="use(${items.indexOf(x)})">Använd</button></div>`).join('')}</div>`:'<p class="hint">Inget här än. Skanna din första vara.</p>');
  return}
 if(!cur){
  $('#h').textContent='Skanna vara';$('#s').textContent='Rikta kameran mot streckkoden';
  m.innerHTML=`<div class="view"><video id="vid" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><i></i><i></i><i></i><i></i><b></b><span id="camnote" style="position:relative;padding:0 24px;text-align:center">Startar kameran…</span></div>
  <div class="row" style="margin-top:12px"><input id="bc" type="text" inputmode="numeric" placeholder="Eller skriv streckkoden" aria-label="Streckkod" onkeydown="if(event.key==='Enter')manual()"><button class="use" style="padding:12px 16px" onclick="manual()">Sök</button></div>
  <button class="link" style="width:100%" onclick="scan()">Prova med en exempelvara</button>`;startCam();return}
 $('#h').textContent='Lägg till vara';$('#s').textContent='Streckkod '+cur.e;
 m.innerHTML=`<div class="card"><div class="prod"><div class="ico" style="overflow:hidden">${cur.img?`<img src="${cur.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:cur.i}</div><div>${cur.u?'<input id="nm" type="text" placeholder="Skriv vad varan heter" value="${nameVal}" aria-label="Namn på varan">':`<h2>${cur.n}</h2>`}<p>${cur.b}</p></div></div></div>
 <div class="lbl">Förvaring</div><div class="seg">${['Kyl','Frys','Skafferi'].map(x=>`<button aria-pressed="${stor===x}" onclick="setStor('${x}')">${x}</button>`).join('')}</div>
 <div class="lbl">Bäst före-datum</div><input id="dt" type="date" value="${exact}" aria-label="Bäst före-datum"><p class="hint" style="text-align:left;margin-top:8px">Titta på förpackningen och välj datumet som står där.</p>
 <div class="lbl">Antal</div><div class="row"><span class="sub">Hur många förpackningar?</span><div class="step"><button onclick="chg(-1)" aria-label="Minska">−</button><output>${qty}</output><button onclick="chg(1)" aria-label="Öka">+</button></div></div>
 <button class="btn" onclick="save()">Spara och skanna nästa</button><button class="btn alt" style="margin-top:10px" onclick="cur=null;render()">Avbryt</button>`}
render();
</script>
</body>
</html>
