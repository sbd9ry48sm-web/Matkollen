<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matkollen</title>
<meta name="theme-color" content="#EEF3F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1519" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matkollen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF3F3;--card:#fff;--ink:#0E2229;--mute:#5B727A;--line:#E1E9EB;--acc:#0E7C86;--onacc:#fff;--tint:#DDF0F1;--desk:#DCE5E7;--ok:#2B7A4B;--warn:#9A6700;--bad:#C0362E;--okbg:#E2F2E8;--warnbg:#FFF1CC;--badbg:#FBE3E0;--view:#0B1519;--sh:0 1px 2px rgba(14,34,41,.05),0 10px 26px -14px rgba(14,34,41,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1519;--card:#13242B;--ink:#E8F1F4;--mute:#8FA8B2;--line:#213A43;--acc:#4FC3CC;--onacc:#06242A;--tint:#173A40;--desk:#050B0E;--ok:#7FD3A0;--warn:#F2C14E;--bad:#FF8F86;--okbg:#17352A;--warnbg:#3A3012;--badbg:#42201D;--view:#050B0E;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0B1519;--card:#13242B;--ink:#E8F1F4;--mute:#8FA8B2;--line:#213A43;--acc:#4FC3CC;--onacc:#06242A;--tint:#173A40;--desk:#050B0E;--ok:#7FD3A0;--warn:#F2C14E;--bad:#FF8F86;--okbg:#17352A;--warnbg:#3A3012;--badbg:#42201D;--view:#050B0E;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
.phone{width:100%;max-width:400px;height:100%;max-height:800px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:500px){.phone{border:1px solid var(--line);border-radius:40px;height:min(800px,96%);box-shadow:0 40px 80px -40px rgba(14,34,41,.45)}}
header{padding:24px 22px 12px}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.03em;line-height:1.1}
.sub{color:var(--mute);font-size:15px;margin:6px 0 0;line-height:1.35}
main{flex:1;overflow-y:auto;padding:8px 20px 24px}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s,background-color .15s}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.view{background:var(--view);border-radius:28px;height:260px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.view i{position:absolute;width:38px;height:38px;border:3.5px solid #fff;opacity:.95}
.view i:nth-child(1){top:40px;left:40px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.view i:nth-child(2){top:40px;right:40px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.view i:nth-child(3){bottom:40px;left:40px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.view i:nth-child(4){bottom:40px;right:40px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.view b{position:absolute;left:50px;right:50px;height:2px;border-radius:2px;background:#FF5A4D;box-shadow:0 0 14px 2px rgba(255,90,77,.6);animation:sc 2.4s ease-in-out infinite alternate}
@keyframes sc{from{top:60px}to{top:196px}}
@media (prefers-reduced-motion:reduce){.view b{animation:none;top:128px}button{transition:none}button:active{transform:none}}
.view span{color:#fff;opacity:.75;font-size:14px}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font-weight:700;font-size:16px;background:var(--acc);color:var(--onacc);margin-top:14px;box-shadow:0 10px 20px -12px var(--acc)}
.btn.alt{background:var(--tint);color:var(--acc);box-shadow:none}
.btn.dark{background:var(--ink);color:var(--bg);box-shadow:none}
.av{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
ol{padding-left:20px;margin:0}ol li{margin-bottom:10px;font-size:15px;line-height:1.45}
.mut{color:var(--mute);font-size:13px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin:14px 0 0;line-height:1.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--sh)}
button.card{display:block}
.prod{display:flex;gap:14px;align-items:center}
.ico{width:56px;height:56px;border-radius:18px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.prod h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.prod p{margin:3px 0 0;color:var(--mute);font-size:13px}
.lbl{font-size:14px;font-weight:700;margin:22px 0 10px}
.seg{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:11px 6px;font-size:14px;font-weight:700;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
input[type=date],input[type=text],input[type=email]{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus{border-color:var(--acc)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step{display:flex;align-items:center;gap:12px}
.step button{width:42px;height:42px;border-radius:14px;border:0;background:var(--tint);color:var(--acc);font-size:20px;font-weight:700}
.step output{min-width:28px;text-align:center;font-weight:800;font-size:18px}
.info{background:var(--okbg);color:var(--ok);border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;line-height:1.4}
.link{background:none;border:0;color:var(--acc);font-weight:700;padding:12px 0;font-size:14px}
nav{display:flex;gap:4px;margin:0 14px 14px;padding:6px;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:var(--sh)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;border-radius:22px;font-size:12px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{background:var(--tint);color:var(--acc)}
.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:first-child{padding-top:0}
.item:last-child{border:0;padding-bottom:0}
.item .t{flex:1;min-width:0}
.item strong{display:block;font-size:15px;font-weight:700}
.item small{color:var(--mute)}
.chip{font-size:12px;font-weight:700;border-radius:99px;padding:6px 11px;white-space:nowrap}
.chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
.use{border:0;background:var(--tint);color:var(--acc);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}
#t{position:absolute;left:20px;right:20px;bottom:98px;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--sh)}
#t.on{opacity:1}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
header{border-bottom:1px solid transparent;transition:border-color .2s}
header.s{border-bottom-color:var(--line)}
#sp{display:none;position:absolute;inset:0;z-index:9;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s}
#sp img{width:96px;height:96px;border-radius:22px;box-shadow:var(--sh)}
#sp b{font-size:22px;font-weight:800;letter-spacing:-.02em}
#sp.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#sp,header{transition:none}}
</style>
</head>
<body>
<div class="phone">
<div id="sp"><img src="icon-192.png" alt=""><b>Matkollen</b></div>
<header><h1 id="h">Skanna vara</h1><p class="sub" id="s"></p></header>
<main id="m"></main>
<nav><button id="n1" onclick="go('scan')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 9v6M12 9v6M16 9v6"/></svg>Skanna</button><button id="n2" onclick="go('list')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3zM6 11h12M9.5 6.5v1.5M9.5 14v3"/></svg>Kylskåp</button><button id="nr" onclick="go('rec')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM3 11h18M9 7c0-1.6 1-1.6 1-3.2M14 7c0-1.6 1-1.6 1-3.2"/></svg>Recept</button><button id="n3" onclick="go('prof')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20.5c0-3.8 3.6-6 8-6s8 2.2 8 6"/></svg>Profil</button></nav>
<div id="t" role="status"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const add=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const fmt=d=>d.toLocaleDateString('sv-SE',{day:'numeric',month:'short'});
const diff=d=>Math.round((d-add(0))/864e5);
const P=[
{n:'Mjölk 1,5 %',b:'Arla · 1 l',e:'7310865001061',d:7,i:'🥛',u:0},
{n:'Kycklingfilé',b:'Kronfågel · 900 g',e:'7350012345678',d:3,i:'🍗',u:0},
{n:'Okänd produkt',b:'Streckkoden finns inte i databasen',e:'7300000000017',d:5,i:'❓',u:1},
{n:'Pasta Penne',b:'Barilla · 500 g',e:'8076802085738',d:365,i:'🍝',u:0,s:'Skafferi'},
{n:'Yoghurt naturell',b:'Valio · 1 kg',e:'6408430000213',d:14,i:'🥣',u:0}];
let k=0,cur=null,stor='Kyl',qty=1,exact='',nameVal='',tab='scan';
const seed=()=>[{n:'Gurka',i:'🥒',st:'Kyl',q:1,date:add(1)},{n:'Ägg 12-pack',i:'🥚',st:'Kyl',q:1,date:add(9)}];
let items=[],user=null,step='welcome',notif=true,when=2,via='',draft='',mail='';
try{const u=JSON.parse(localStorage.getItem('mk')||'null');if(u&&u.name){user=u.name;notif=u.notif;when=u.when;via=u.via||'';step='done'}}catch(e){}
function persist(){try{if(user)localStorage.setItem('mk',JSON.stringify({name:user,notif,when,via}));else localStorage.removeItem('mk')}catch(e){}}
try{items=JSON.parse(localStorage.getItem('mk_items')||'[]').map(x=>({...x,date:new Date(x.date)}))}catch(e){items=[]}
let names={};try{names=JSON.parse(localStorage.getItem('mk_names')||'{}')}catch(e){}
function saveItems(){try{localStorage.setItem('mk_items',JSON.stringify(items))}catch(e){}}
let stream=null,rd=null;
function stopCam(){if(stream&&stream.getTracks)stream.getTracks().forEach(t=>t.stop());stream=null;if(rd){try{rd.reset()}catch(e){}rd=null}}
async function startCam(){
 const v=$('#vid');if(!v)return;
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
  if('BarcodeDetector' in window){
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
   if(!$('#vid')){stopCam();return}
   v.srcObject=stream;await v.play();
   const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a']});
   const loop=async()=>{if(!stream)return;try{const c=await det.detect(v);if(c.length){found(c[0].rawValue);return}}catch(e){}setTimeout(loop,250)};loop();
  }else if(window.ZXing){
   rd=new ZXing.BrowserMultiFormatReader();
   await rd.decodeFromVideoDevice(null,'vid',r=>{if(r)found(r.getText())});
  }else throw 0;
  const n=$('#camnote');if(n)n.textContent='';
 }catch(e){stopCam();const n=$('#camnote');if(n)n.textContent='Kameran kunde inte startas. Skriv in streckkoden nedan eller prova en exempelvara.'}
}
function begin(c){stopCam();cur=c;stor=c.s||'Kyl';qty=1;exact='';nameVal='';render()}
let busy=false;
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function found(code){code=String(code).trim();if(busy)return;busy=true;stopCam();
 if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
 const b=P.find(p=>p.e===code),sv=names[code];
 if(b){busy=false;return begin({...b})}
 if(sv){busy=false;return begin({n:sv.n,b:sv.b||'Sparad av dig',e:code,i:'🛒',u:0,img:sv.img})}
 toast('Söker produkten…');
 let c={n:'Okänd produkt',b:'Hittades inte i Open Food Facts. Skriv in namnet så minns appen det.',e:code,i:'❓',u:1};
 try{
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),7000);
  const res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,quantity,image_front_small_url',{signal:ctl.signal});
  clearTimeout(t);
  const j=await res.json(),p=j&&j.product;
  if(j&&j.status===1&&p&&p.product_name){
   const img=/^https:\/\//.test(p.image_front_small_url||'')?esc(p.image_front_small_url):'';
   c={n:esc(p.product_name),b:esc([(p.brands||'').split(',')[0].trim(),p.quantity].filter(Boolean).join(' · '))||'Open Food Facts',e:code,i:'🛒',u:0,img};
   names[code]={n:c.n,b:c.b,img};try{localStorage.setItem('mk_names',JSON.stringify(names))}catch(e){}
  }
 }catch(e){c.b='Kunde inte nå produktdatabasen. Skriv in namnet så minns appen det.'}
 busy=false;begin(c)}
function manual(){const v=$('#bc').value.replace(/\D/g,'');if(v.length<8){toast('Streckkoder har 8 eller 13 siffror');return}found(v)}
const WH=[['2 dagar före',2],['1 dag före',1],['Samma dag',0]];
function nameOk(){const v=$('#un').value.trim();if(!v){toast('Skriv ditt namn först');$('#un').focus();return null}return v}
function withApple(){const v=nameOk();if(!v)return;user=v;via='Apple';step='notif';persist();render();toast('Verifierad med Apple')}
function withMail(){const v=nameOk();if(!v)return;draft=v;step='email';render()}
function sendCode(){const v=$('#em').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('Skriv en giltig e-postadress');$('#em').focus();return}mail=v;step='code';render();toast('Kod skickad till '+v)}
function verify(){const c=$('#cd').value.replace(/\D/g,'');if(c.length!==6){toast('Skriv koden med 6 siffror');$('#cd').focus();return}user=draft;via=mail;step='notif';persist();render()}
function back(x){step=x;render()}
function setWhen(x){when=x;persist();render()}
function notifOn(x){if(x){try{Notification.requestPermission()}catch(e){}}notif=x;step='done';persist();render();toast(x?'Notiser på: vi påminner dig':'Notiser av. Du kan slå på dem under Profil')}
function toggleNotif(){notif=!notif;persist();render()}
function logout(){user=null;via='';draft='';mail='';step='welcome';cur=null;tab='scan';items=[];saveItems();persist();render()}
const whenSeg=()=>`<div class="seg">${WH.map(w=>`<button aria-pressed="${when===w[1]}" onclick="setWhen(${w[1]})">${w[0]}</button>`).join('')}</div>`;
let openR=null;
const R=[
{n:'Pannkakor',i:'🥞',t:'25 min',g:['ägg','mjölk'],x:'mjöl, smör, salt',s:['Vispa ihop ägg, mjölk och mjöl till en slät smet.','Låt smeten vila i 10 minuter.','Stek tunna pannkakor i smör på medelvärme.']},
{n:'Kycklingpasta',i:'🍝',t:'30 min',g:['kyckling','pasta','grädde'],x:'salt, peppar, olja',s:['Koka pastan enligt förpackningen.','Skär kycklingen i bitar och stek den i olja tills den är genomstekt.','Häll i grädden, smaka av med salt och peppar och vänd ner pastan.']},
{n:'Kycklingsallad med yoghurtdressing',i:'🥗',t:'20 min',g:['kyckling','gurka','yoghurt'],x:'salt, peppar, olja',s:['Stek kycklingen i olja och låt den svalna lite.','Skiva gurkan och lägg den på tallriken.','Rör ihop yoghurt, salt och peppar till en dressing och lägg på kycklingen.']},
{n:'Tzatziki',i:'🥒',t:'10 min',g:['gurka','yoghurt'],x:'vitlök, salt, olja',s:['Riv gurkan och krama ut vätskan.','Blanda med yoghurt, pressad vitlök, salt och en skvätt olja.','Låt stå kallt en stund innan servering.']},
{n:'Äggpasta',i:'🍳',t:'15 min',g:['pasta','ägg'],x:'smör, salt, peppar',s:['Koka pastan och spara lite av kokvattnet.','Stek äggen i smör.','Vänd pastan med smör och lite kokvatten och lägg äggen ovanpå.']},
{n:'Köttbullar med gräddsås',i:'🧆',t:'40 min',g:['färs','grädde'],x:'ströbröd, ägg, lök, smör, mjöl, salt, peppar',s:['Blanda färsen med fuktat ströbröd, rivet lök, salt och peppar och rulla bollar.','Stek bullarna i smör tills de är genomstekta och ta upp dem.','Rör mjöl i pannan, späd med grädde och vatten och koka en sås. Lägg tillbaka bullarna.']},
{n:'Raggmunk',i:'🥔',t:'35 min',g:['potatis','fläsk'],x:'mjöl, mjölk, ägg, smör, salt',s:['Riv potatisen grovt och rör ihop med mjöl, mjölk, ägg och salt.','Stek små plättar i smör tills de är gyllene på båda sidor.','Stek fläsket knaprigt och servera tillsammans.']},
{n:'Pytt i panna',i:'🍳',t:'25 min',g:['potatis','korv'],x:'lök, smör, salt, peppar',s:['Skär potatis, korv och lök i små tärningar.','Stek potatisen i smör tills den är gyllene, lägg i korv och lök.','Stek tills allt är varmt och krispigt och krydda med salt och peppar.']},
{n:'Ärtsoppa',i:'🥣',t:'1 tim 30 min',g:['ärtor','fläsk'],x:'lök, timjan, salt',s:['Blötlägg gula ärtor över natten och häll av vattnet.','Koka ärtorna med fläsket och hackad lök i nytt vatten i cirka 1 timme.','Ta upp fläsket, skär det i bitar och lägg tillbaka i soppan.']},
{n:'Falukorv i ugn',i:'🌭',t:'35 min',g:['falukorv'],x:'senap, ketchup, ost',s:['Gör djupa snitt i korven och pensla med senap.','Fyll snitten med ost.','Grädda i 200 grader i cirka 25 minuter.']},
{n:'Stekt sill med potatismos',i:'🐟',t:'35 min',g:['sill','potatis'],x:'ströbröd, smör, mjölk, salt',s:['Koka potatisen mjuk och mosa den med smör och varm mjölk.','Vänd sillfiléerna i ströbröd.','Stek dem i smör tills de är gyllene och servera med moset.']},
{n:'Fiskgratäng',i:'🐟',t:'45 min',g:['fisk','grädde'],x:'potatis, ost, dill, salt',s:['Skiva kokt potatis och lägg i en form med fiskbitarna.','Häll över grädde med dill och salt och strö över ost.','Grädda i 200 grader i 25 minuter.']},
{n:'Lax i ugn',i:'🍣',t:'30 min',g:['lax','potatis'],x:'dill, citron, smör, salt',s:['Lägg laxen i en form, salta och lägg citron och dill ovanpå.','Grädda i 175 grader i cirka 15 minuter.','Servera med kokt potatis och smör.']},

 m.innerHTML=`<div class="card"><div class="prod"><div class="ico" style="overflow:hidden">${cur.img?`<img src="${cur.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:cur.i}</div><div>${cur.u?`<input id="nm" type="text" placeholder="Skriv vad varan heter" value="${esc(nameVal)}" aria-label="Namn på varan">`:`<h2>${cur.n}</h2>`}<p>${cur.b}</p></div></div></div>
 <div class="lbl">Förvaring</div><div class="seg">${['Kyl','Frys','Skafferi'].map(x=>`<button aria-pressed="${stor===x}" onclick="setStor('${x}')">${x}</button>`).join('')}</div>
 <div class="lbl">Bäst före-datum</div><input id="dt" type="date" value="${exact}" aria-label="Bäst före-datum"><p class="hint" style="text-align:left;margin-top:8px">Titta på förpackningen och välj datumet som står där.</p>
 <div class="lbl">Antal</div><div class="row"><span class="sub">Hur många förpackningar?</span><div class="step"><button onclick="chg(-1)" aria-label="Minska">−</button><output>${qty}</output><button onclick="chg(1)" aria-label="Öka">+</button></div></div>
 <button class="btn" onclick="save()">Spara och skanna nästa</button><button class="btn alt" style="margin-top:10px" onclick="cur=null;render()">Avbryt</button>`}

const hd=document.querySelector('header');$('#m').addEventListener('scroll',e=>hd.classList.toggle('s',e.target.scrollTop>4),{passive:true});
const isStd=()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const isIos=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(tab==='prof'&&user&&step==='done')render()});
addEventListener('appinstalled',()=>{dip=null;if(user&&step==='done')render()});
function doInstall(){if(!dip)return;dip.prompt();dip.userChoice.finally(()=>{dip=null;render()})}
function installCard(){
 if(isStd())return'';
 if(dip)return `<div class="lbl">Installera appen</div><div class="card"><p class="mut" style="margin:0;font-size:14px;line-height:1.5">Lägg Matkollen på hemskärmen så öppnas den som en vanlig app.</p><button class="btn" style="margin-top:14px" onclick="doInstall()">Installera Matkollen</button></div>`;
 if(isIos())return `<div class="lbl">Installera appen</div><div class="card"><p style="margin:0 0 6px;font-weight:700">Lägg till på hemskärmen</p><p class="mut" style="margin:0;font-size:14px;line-height:1.5">Öppna sidan i Safari, tryck på Dela-knappen och välj Lägg till på hemskärmen. Då öppnas Matkollen i helskärm som en riktig app.</p></div>`;
 return''}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(isStd()){const sp=$('#sp');sp.style.display='flex';setTimeout(()=>sp.classList.add('out'),800)}
render();
</script>
