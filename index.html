<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matkollen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' aria-hidden='true'%3E%3Crect rx='9' fill='%23245B45'/%3E%3Cpath d='M16 25V15' stroke='%23F3F6EC' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Cpath d='M16 18c-5.5 0-8.5-3-8.5-7.5C13 10.5 16 13 16 18z' fill='%238EBB91'/%3E%3Cpath d='M16 15.5c0-5.5 3.5-9 9-9 0 5.5-3.5 9-9 9z' fill='%23F3F6EC'/%3E%3C/svg%3E">
<style>
:root{--mk-forest:#245B45;--mk-sage:#8EBB91;--mk-cream:#F3F6EC;--mk-white:#fff;--mk-ink:#25332B;--mk-muted:#59675E;--mk-border:#D8E0D4;--mk-warning:#D97732;--mk-danger:#B94040;
--r-md:.875rem;--r-lg:1.25rem;--shadow:0 4px 16px rgb(36 91 69/8%);--focus:0 0 0 3px rgb(142 187 145/55%);
--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--mk-cream);color:var(--mk-ink);font-family:var(--font);line-height:1.5;
padding-top:env(safe-area-inset-top,0px)}
#app{max-width:760px;margin:0 auto;padding:1.25rem 1rem calc(6rem + env(safe-area-inset-bottom,0px))}
h1{font-size:1.75rem;line-height:1.2;margin:0 0 .25rem;letter-spacing:-.01em}
h2{font-size:1.125rem;margin:1.75rem 0 .75rem}
p{margin:0}
.muted{color:var(--mk-muted)}
.sub{margin-bottom:1.25rem}
.brand{display:flex;align-items:center;gap:.625rem;color:var(--mk-forest);font-weight:750;font-size:1.25rem;letter-spacing:-.01em;margin-bottom:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:.75rem 1.125rem;border:1px solid transparent;border-radius:var(--r-md);background:var(--mk-forest);color:#fff;font:inherit;font-weight:650;cursor:pointer}
.btn:hover{background:#1C4938}
.btn:active{transform:translateY(1px)}
.btn--ghost{background:#fff;color:var(--mk-forest);border-color:var(--mk-border)}
.btn--ghost:hover{background:var(--mk-cream)}
.btn--onDark{background:#fff;color:var(--mk-forest)}
.btn--onDark:hover{background:var(--mk-cream)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:var(--focus);border-color:var(--mk-forest)}
.card{background:#fff;border:1px solid var(--mk-border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:1rem}
.stack{display:grid;gap:.75rem}
.scan{background:var(--mk-forest);color:#fff;border-radius:var(--r-lg);padding:1.5rem;display:grid;gap:.75rem}
.scan h2{margin:0;font-size:1.375rem}
.scan p{color:#E3F0E3}
.row{display:flex;align-items:center;gap:.75rem}
.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.emoji{width:2.75rem;height:2.75rem;border-radius:var(--r-md);background:var(--mk-cream);display:grid;place-items:center;font-size:1.5rem;flex:none}
.name{font-weight:650}
.status{display:inline-flex;align-items:center;gap:.375rem;padding:.25rem .625rem;border-radius:999px;font-size:.8125rem;font-weight:650;white-space:nowrap}
.status::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.s-good{background:#E3F0E3;color:#245B45}
.s-soon{background:#FFF0DF;color:#8A4312}
.s-urgent{background:#FBE7E5;color:#8D2727}
.input{display:block;width:100%;min-height:2.75rem;padding:.75rem .875rem;border:1px solid var(--mk-border);border-radius:var(--r-md);background:#fff;color:var(--mk-ink);font:inherit}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.75rem 0 .25rem;margin:0 -1rem;padding-inline:1rem}
.chip{flex:none;min-height:2.5rem;padding:.5rem 1rem;border-radius:999px;border:1px solid var(--mk-border);background:#fff;color:var(--mk-ink);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--mk-forest);border-color:var(--mk-forest);color:#fff;font-weight:650}
.tag{display:inline-block;font-size:.8125rem;font-weight:650;padding:.125rem .5rem;border-radius:.5rem;background:#E3F0E3;color:#245B45}
.tag--save{background:#FFF0DF;color:#8A4312}
.have{color:var(--mk-forest)}
.miss{color:#8D2727}
.link{background:none;border:0;padding:.5rem 0;color:var(--mk-forest);font:inherit;font-weight:650;cursor:pointer;min-height:2.75rem}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
.form{display:grid;gap:.75rem}
label{font-weight:650;font-size:.9375rem;display:grid;gap:.25rem}
.empty{text-align:center;padding:2rem 1rem}
.empty .emoji{margin:0 auto .75rem;width:3.5rem;height:3.5rem;font-size:1.75rem}
ol.steps{padding-left:1.25rem;margin:.5rem 0 0;display:grid;gap:.75rem}
.hero{height:9rem;border-radius:var(--r-lg);background:linear-gradient(135deg,#8EBB91,#E3F0E3);display:grid;place-items:center;font-size:4rem;margin-bottom:1rem}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,760px);display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem;padding:.5rem .5rem calc(.5rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--mk-border);background:#fff}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;min-height:3.25rem;border:0;border-radius:var(--r-md);background:transparent;color:var(--mk-muted);font:inherit;font-size:.75rem;cursor:pointer}
nav button[aria-current=page]{background:var(--mk-cream);color:var(--mk-forest);font-weight:700}
nav svg{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--mk-ink);color:#fff;padding:.75rem 1rem;border-radius:var(--r-md);font-size:.9375rem;max-width:90%}
.scanBox{position:fixed;inset:0;z-index:20;background:var(--mk-cream);overflow:auto;padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1rem 2rem}.scanBox[hidden]{display:none}.scanIn{max-width:760px;margin:0 auto}#reader{border-radius:var(--r-lg);overflow:hidden;background:#1d2a23;min-height:11rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"><main id="main"></main></div>
<nav id="nav" aria-label="Huvudmeny"></nav>
<div id="scanBox" class="scanBox" hidden role="dialog" aria-modal="true" aria-label="Skanna vara"><div class="scanIn"><h2 style="margin-top:0">Skanna streckkod</h2><div id="reader"></div><p id="scanMsg" class="muted" style="margin:.75rem 0" role="status"></p><form id="codeForm" class="form"><label>Eller skriv in streckkoden<input class="input" name="c" inputmode="numeric" pattern="[0-9]{8,14}" placeholder="Till exempel 7310865001115"></label><div class="actions" style="margin-top:0"><button class="btn" type="submit">Sök vara</button><button class="btn btn--ghost" type="button" data-act="closescan">Avbryt</button></div></form></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const ICONS={
scan:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>',
fridge:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M6 10h12M9 6v1.5M9 13v3"/></svg>',
recipe:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-2-1.5-5-1.5-8-1v14c3-.5 6-.5 8 1 2-1.5 5-1.5 8-1V4c-3-.5-6-.5-8 1zM12 5v14"/></svg>',
profile:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>'};
const LEAF='<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#245B45"/><path d="M16 25V15" stroke="#F3F6EC" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M16 18c-5.5 0-8.5-3-8.5-7.5C13 10.5 16 13 16 18z" fill="#8EBB91"/><path d="M16 15.5c0-5.5 3.5-9 9-9 0 5.5-3.5 9-9 9z" fill="#F3F6EC"/></svg>';
const TABS=[["scan","Skanna"],["fridge","Kylskåp"],["recipe","Recept"],["profile","Profil"]];
const CATS=["Alla","Grönsaker","Mejeri","Kött","Annat"];
const EMO={Grönsaker:"🥬",Mejeri:"🥛",Kött:"🍗",Annat:"🥫"};

const DEMO=[
{id:1,name:"Spenat",cat:"Grönsaker",days:0,qty:"1 påse",e:"🥬"},
{id:2,name:"Mjölk",cat:"Mejeri",days:1,qty:"1 liter",e:"🥛"},
{id:3,name:"Kycklingfilé",cat:"Kött",days:2,qty:"500 g",e:"🍗"},
{id:4,name:"Yoghurt",cat:"Mejeri",days:2,qty:"1 burk",e:"🥣"},
{id:5,name:"Grädde",cat:"Mejeri",days:3,qty:"2 dl",e:"🥛"},
{id:6,name:"Paprika",cat:"Grönsaker",days:5,qty:"2 st",e:"🫑"},
{id:7,name:"Ägg",cat:"Mejeri",days:9,qty:"10 st",e:"🥚"},
{id:8,name:"Morot",cat:"Grönsaker",days:12,qty:"1 kg",e:"🥕"},
{id:9,name:"Ost",cat:"Mejeri",days:14,qty:"400 g",e:"🧀"}];
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const addDays=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getTime()};
const daysLeft=t=>{const m=new Date();m.setHours(0,0,0,0);return Math.round((t-m.getTime())/864e5)};
const toISO=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SB_URL="https://zhhrxrimlpespjmpwqre.supabase.co";
const SB_KEY="sb_publishable_-JRASwLzorPstnibFrFDWw_wbA-Hpe-";
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
let items=[];
let acct=null;
let userId=null;
let ready=false;
const RECIPES=[
{id:1,name:"Spenatomelett",min:15,e:"🍳",serv:2,ing:["Ägg","Spenat","Ost","Smör"],steps:["Vispa äggen med en nypa salt.","Fräs spenaten i smör tills den faller ihop.","Häll över äggen och strö på riven ost.","Stek på medelvärme tills omeletten stelnat och vik ihop."]},
{id:2,name:"Krämig kycklinggryta",min:35,e:"🍲",serv:4,ing:["Kycklingfilé","Paprika","Grädde","Ris"],steps:["Skär kycklingen och paprikan i bitar.","Bryn kycklingen och fräs paprikan med.","Tillsätt grädde och låt sjuda i 10 minuter.","Servera med kokt ris."]},
{id:3,name:"Morotssoppa",min:40,e:"🥕",serv:4,ing:["Morot","Grädde","Lök"],steps:["Fräs hackad lök mjuk.","Tillsätt morötter och vatten, koka tills de är mjuka.","Mixa slätt och rör i grädden.","Smaksätt med salt och peppar."]},
{id:4,name:"Yoghurtpannkakor",min:20,e:"🥞",serv:3,ing:["Ägg","Mjölk","Yoghurt","Vetemjöl"],steps:["Rör ihop ägg, mjölk, yoghurt och mjöl till en slät smet.","Låt smeten vila några minuter.","Stek små pannkakor i smör på medelvärme."]}];
let st={tab:"scan",cat:"Alla",q:"",adding:false,recipe:null,favs:new Set(),onlyFav:false,authMode:"signup"};
const $=s=>document.querySelector(s);
const status=d=>d<=0?["urgent","Behöver användas idag"]:d<=3?["soon","Använd snart"]:["good","Bra"];
const badge=d=>{const[k,t]=status(d);return`<span class="status s-${k}">${t}</span>`};
const left=d=>d<0?"Utgången för "+(-d)+(d===-1?" dag":" dagar")+" sedan":d===0?"Går ut idag":d===1?"1 dag kvar":d+" dagar kvar";
const sorted=()=>[...items].sort((a,b)=>a.days-b.days);
const has=n=>items.find(i=>i.name.toLowerCase()===n.toLowerCase());
function rInfo(r){const have=[],miss=[];let urgent=false;r.ing.forEach(n=>{const it=has(n);if(it){have.push(n);if(it.days<=3)urgent=true}else miss.push(n)});return{have,miss,urgent,score:(urgent?100:0)+have.length*5-miss.length}}
const ranked=()=>RECIPES.map(r=>({r,...rInfo(r)})).filter(x=>x.have.length).sort((a,b)=>b.score-a.score);

function itemCard(i){return`<div class="card"><div class="row"><div class="emoji" aria-hidden="true">${i.e}</div><div class="grow"><div class="name">${esc(i.name)}</div><div class="muted">${esc(i.qty)} · ${left(i.days)}</div></div>${badge(i.days)}</div>
<div class="actions"><button class="btn btn--ghost" data-act="used" data-id="${i.id}">Markera som använd</button><button class="btn btn--ghost" data-act="del" data-id="${i.id}">Ta bort</button></div></div>`}
function recipeCard(x){const{r,have,miss,urgent}=x;return`<button class="card" style="text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%" data-act="open" data-id="${r.id}">
<div class="row"><div class="emoji" aria-hidden="true">${r.e}</div><div class="grow"><div class="name">${r.name}</div><div class="muted">${r.min} min</div></div>${urgent?'<span class="tag tag--save">Rädda maten</span>':''}</div>
<p style="margin-top:.75rem"><span class="have"><b>Du har hemma:</b> ${have.join(", ")}</span></p>
${miss.length?`<p><span class="miss"><b>Du saknar:</b> ${miss.join(", ")}</span></p>`:'<p class="have"><b>Du har allt som behövs</b></p>'}</button>`}

function viewScan(){
const first=sorted().filter(i=>i.days<=3),rec=ranked().slice(0,2);
return`<div class="brand">${LEAF}<span>Matkollen</span></div>
<h1>Hej${acct?", "+esc(acct.name):""}!</h1><p class="muted sub">Mindre matsvinn. Mer matglädje.</p>
<section class="scan"><h2>Skanna en vara</h2><p>Rikta kameran mot streckkoden så lägger vi in varan i kylskåpet.</p><div class="actions" style="margin-top:0"><button class="btn btn--onDark" data-act="scan">Skanna streckkod</button><button class="btn btn--onDark" data-act="add">Lägg till vara</button></div></section>
<h2>Ditt kylskåp</h2><div class="card between"><div><div class="name">${items.length} varor hemma</div><div class="muted">${first.length} behöver användas snart</div></div><button class="link" data-go="fridge">Se alla</button></div>
<h2>Behöver användas först</h2><div class="stack">${first.length?first.map(i=>`<div class="card row"><div class="emoji" aria-hidden="true">${i.e}</div><div class="grow"><div class="name">${esc(i.name)}</div><div class="muted">${left(i.days)}</div></div>${badge(i.days)}</div>`).join(""):'<div class="card muted">Inget behöver användas just nu.</div>'}</div>
<div class="between"><h2>Recept med dina varor</h2><button class="link" data-go="recipe">Se alla</button></div>
${rec.length?`<div class="stack">${rec.map(recipeCard).join("")}</div>`:'<div class="card muted">Lägg in några varor så dyker receptförslag upp här.</div>'}`}

function viewFridge(){
return`<h1>Kylskåp</h1><p class="muted sub">${items.length} varor hemma</p>
<div class="actions" style="margin-top:0"><button class="btn" data-act="scan">Skanna vara</button><button class="btn btn--ghost" data-act="add">Lägg till vara</button></div>
${st.adding?`<form class="card form" id="addForm" style="margin-top:.75rem"><label>Namn<input class="input" name="n" required placeholder="Till exempel Gurka" value="${esc((st.prefill||{}).name)}"></label>
<label>Kategori<select class="input" name="c">${CATS.slice(1).map(c=>`<option${c===(st.prefill||{}).cat?" selected":""}>${c}</option>`).join("")}</select></label>
<label>Bäst före-datum<input class="input" name="d" type="date" required value="${toISO(addDays(5))}"></label>
<label>Mängd (valfritt)<input class="input" name="q" placeholder="Till exempel 500 g" value="${esc((st.prefill||{}).qty)}"></label>
<div class="actions" style="margin-top:0"><button class="btn" type="submit">Spara vara</button><button class="btn btn--ghost" type="button" data-act="cancel">Avbryt</button></div></form>`:""}
<div style="margin-top:.75rem"><input class="input" id="q" type="search" placeholder="Sök bland dina varor" aria-label="Sök bland dina varor" value="${st.q}"></div>
<div class="chips" role="group" aria-label="Kategori">${CATS.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${st.cat===c}">${c}</button>`).join("")}</div>
<div id="list"></div>`}
function fridgeList(){
const q=st.q.toLowerCase(),all=sorted().filter(i=>(st.cat==="Alla"||i.cat===st.cat)&&i.name.toLowerCase().includes(q));
const urgent=all.filter(i=>i.days<=3),rest=all.filter(i=>i.days>3);
let h="";
if(!all.length)h=items.length?'<div class="card empty"><div class="emoji" aria-hidden="true">🧺</div><p class="name">Inga varor hittades</p><p class="muted">Ändra sökningen eller lägg till en vara.</p></div>':'<div class="card empty"><div class="emoji" aria-hidden="true">🧺</div><p class="name">Kylskåpet är tomt</p><p class="muted">Skanna en vara eller lägg in den själv.</p><button class="btn btn--ghost" data-act="demo">Prova med exempelvaror</button></div>';
if(urgent.length)h+=`<h2>Behöver användas först</h2><div class="stack">${urgent.map(itemCard).join("")}</div>`;
if(rest.length)h+=`<h2>Övriga varor</h2><div class="stack">${rest.map(itemCard).join("")}</div>`;
$("#list").innerHTML=h}

function viewRecipes(){
let list=ranked();if(st.onlyFav)list=list.filter(x=>st.favs.has(x.r.id));
const soon=list.filter(x=>x.urgent),other=list.filter(x=>!x.urgent);
return`<h1>Recept med det du har hemma</h1><p class="muted sub">Vi börjar med det som går ut först.</p>
<div class="chips" role="group" aria-label="Visa"><button class="chip" data-fav="0" aria-pressed="${!st.onlyFav}">Alla förslag</button><button class="chip" data-fav="1" aria-pressed="${st.onlyFav}">Mina favoriter</button></div>
${!list.length?'<div class="card empty"><div class="emoji" aria-hidden="true">🍽️</div><p class="name">Inga recept matchar just nu</p><p class="muted">Lägg till fler varor eller ändra filtren för att se fler förslag.</p></div>':""}
${soon.length?`<h2>Rädda maten</h2><div class="stack">${soon.map(recipeCard).join("")}</div>`:""}
${other.length?`<h2>Fler förslag</h2><div class="stack">${other.map(recipeCard).join("")}</div>`:""}`}

function viewDetail(){
const r=RECIPES.find(x=>x.id===st.recipe),x=rInfo(r),fav=st.favs.has(r.id);
return`<button class="link" data-act="back">‹ Tillbaka</button>
<div class="hero" aria-hidden="true">${r.e}</div>
<div class="between"><h1>${r.name}</h1><button class="chip" data-act="fav" aria-pressed="${fav}" aria-label="Favorit">${fav?"♥ Favorit":"♡ Spara"}</button></div>
<p class="muted">Tillagningstid ${r.min} min · ${r.serv} portioner</p>
<h2>Ingredienser</h2><div class="card stack">${r.ing.map(n=>`<div class="between"><span>${n}</span><span class="${has(n)?"have":"miss"}"><b>${has(n)?"Du har hemma":"Du saknar"}</b></span></div>`).join("")}</div>
<h2>Steg för steg</h2><div class="card"><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`}

function viewProfile(){
return`<h1>Profil</h1><p class="muted sub">Mindre matsvinn. Mer matglädje.</p>
<div class="card stack"><div class="between"><span>Namn</span><b>${esc(acct&&acct.name)}</b></div>${acct&&acct.email?`<div class="between"><span>E-post</span><b>${esc(acct.email)}</b></div>`:""}<div class="between"><span>Varor hemma</span><b>${items.length}</b></div></div>
<p class="muted" style="margin:1rem 0">Dina varor sparas på ditt konto, så de följer med om du loggar in på en annan enhet.</p>
<div class="actions"><button class="btn" data-act="logout">Logga ut</button><button class="btn btn--ghost" data-act="reset">Ta bort alla mina varor</button></div>`}

function viewAuth(){
const su=st.authMode==="signup";
return`<div style="padding-top:1.5rem"><div class="brand">${LEAF}<span>Matkollen</span></div>
<h1>${su?"Skapa ditt konto":"Logga in"}</h1><p class="muted sub">Mindre matsvinn. Mer matglädje.</p>
<form class="card form" id="authForm"><p>Håll koll på bäst före-datum och ta vara på maten i tid.</p>
${su?'<label>Namn<input class="input" name="n" required autocomplete="given-name" placeholder="Ditt förnamn"></label>':""}
<label>E-post<input class="input" name="e" type="email" required autocomplete="email" placeholder="namn@exempel.se"></label>
<label>Lösenord<input class="input" name="p" type="password" required minlength="6" autocomplete="${su?"new-password":"current-password"}" placeholder="Minst 6 tecken"></label>
<p id="authMsg" class="miss" role="alert"></p>
<button class="btn" type="submit">${su?"Skapa konto":"Logga in"}</button></form>
<button class="link" data-act="authmode" style="margin-top:.5rem">${su?"Har du redan ett konto? Logga in":"Ny här? Skapa konto"}</button></div>`}

function render(){
items.forEach(i=>{if(i.exp)i.days=daysLeft(i.exp)});
if(!ready){$("#nav").innerHTML="";$("#main").innerHTML='<p class="muted" style="padding-top:3rem;text-align:center" role="status">Laddar…</p>';return}
if(!acct){$("#nav").innerHTML="";$("#main").innerHTML=viewAuth();return}
$("#nav").innerHTML=TABS.map(([k,l])=>`<button data-go="${k}" ${st.tab===k?'aria-current="page"':""}>${ICONS[k]}<span>${l}</span></button>`).join("");
$("#main").innerHTML=st.tab==="recipe"&&st.recipe?viewDetail():{scan:viewScan,fridge:viewFridge,recipe:viewRecipes,profile:viewProfile}[st.tab]();
if(st.tab==="fridge")fridgeList()}
function toast(t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

document.addEventListener("click",async e=>{
const b=e.target.closest("[data-go],[data-act],[data-cat],[data-fav]");if(!b)return;
const D=b.dataset,id=D.id;
if(D.go){st.tab=D.go;st.recipe=null;st.adding=false;window.scrollTo(0,0)}
else if(D.cat){st.cat=D.cat}
else if(D.fav){st.onlyFav=D.fav==="1"}
else if(D.act==="add"){st.tab="fridge";st.adding=true;st.prefill=null}
else if(D.act==="scan"){openScan();return}
else if(D.act==="closescan"){closeScan();return}
else if(D.act==="demo"){await addDemo()}
else if(D.act==="reset"){if(!confirm("Ta bort alla dina varor?"))return;await deleteAll()}
else if(D.act==="logout"){try{await sb.auth.signOut()}catch(x){}setUser(null);items=[];st.tab="scan";window.scrollTo(0,0)}
else if(D.act==="authmode"){st.authMode=st.authMode==="signup"?"login":"signup"}
else if(D.act==="cancel"){st.adding=false;st.prefill=null}
else if(D.act==="used"){const i=items.find(x=>x.id===id);if(i&&await removeItem(id))toast(i.name+" markerad som använd")}
else if(D.act==="del"){const i=items.find(x=>x.id===id);if(i&&await removeItem(id))toast(i.name+" borttagen")}
else if(D.act==="open"){st.recipe=+id;window.scrollTo(0,0)}
else if(D.act==="back"){st.recipe=null}
else if(D.act==="fav"){st.favs.has(st.recipe)?st.favs.delete(st.recipe):st.favs.add(st.recipe)}
render()});
document.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;fridgeList()}});
document.addEventListener("submit",async e=>{
const id=e.target.id;if(!["addForm","authForm","codeForm"].includes(id))return;e.preventDefault();
const f=new FormData(e.target);
if(id==="authForm"){await doAuth(e.target,f)}
else if(id==="codeForm"){onCode(f.get("c").trim())}
else{const c=f.get("c"),exp=new Date(f.get("d")+"T00:00:00").getTime();
const ok=await addItem({name:f.get("n").trim(),cat:c,exp,qty:(f.get("q")||"").trim()||"1 st",e:EMO[c]});
if(ok){st.adding=false;st.prefill=null;render();toast("Varan är sparad")}}});

function authErr(er){const m=(er.message||"").toLowerCase();
if(m.includes("invalid login"))return"Fel e-post eller lösenord.";
if(m.includes("already registered"))return"Det finns redan ett konto med den e-posten. Logga in istället.";
if(m.includes("at least"))return"Lösenordet måste vara minst 6 tecken.";
if(m.includes("not confirmed"))return"Bekräfta din e-post först. Öppna länken i mejlet vi skickade.";
if(m.includes("rate limit"))return"För många försök. Vänta en stund och försök igen.";
if(m.includes("invalid"))return"Kontrollera e-postadressen.";
return"Något gick fel: "+er.message}
async function doAuth(form,f){
const msg=$("#authMsg"),btn=form.querySelector("button[type=submit]");
const email=f.get("e").trim(),pw=f.get("p"),su=st.authMode==="signup";
const say=(t,ok)=>{msg.textContent=t;msg.className=ok?"have":"miss"};
say("");btn.disabled=true;
try{
if(!sb){say("Inloggningen kunde inte laddas. Kontrollera nätverket.");return}
const res=su?await sb.auth.signUp({email,password:pw,options:{data:{name:(f.get("n")||"").trim()}}}):await sb.auth.signInWithPassword({email,password:pw});
if(res.error){say(authErr(res.error));return}
const u=res.data.session?res.data.session.user:null;
if(!u){say("Vi har skickat ett mejl till "+email+". Öppna länken i mejlet och logga sedan in.",true);return}
setUser(u);await loadItems();st.tab="scan";window.scrollTo(0,0);render()
}catch(x){say("Något gick fel. Kontrollera nätverket och försök igen.")}
finally{btn.disabled=false}}

// Databas
const fromRow=r=>({id:r.id,name:r.name,cat:r.cat,qty:r.qty||"1 st",e:r.e||EMO[r.cat]||"🥫",exp:Number(r.exp),days:daysLeft(Number(r.exp))});
function setUser(u){userId=u?u.id:null;acct=u?{name:(u.user_metadata&&u.user_metadata.name)||"",email:u.email||""}:null}
async function loadItems(){const{data,error}=await sb.from("items").select("*").order("exp");if(error){toast("Kunde inte hämta dina varor.");return}items=data.map(fromRow)}
async function addItem(o){const{data,error}=await sb.from("items").insert(o).select().single();if(error){toast("Kunde inte spara varan. Försök igen.");return false}items.push(fromRow(data));return true}
async function removeItem(id){const{error}=await sb.from("items").delete().eq("id",id);if(error){toast("Något gick fel. Försök igen.");return false}items=items.filter(x=>x.id!==id);return true}
async function deleteAll(){const{error}=await sb.from("items").delete().eq("user_id",userId);if(error){toast("Något gick fel. Försök igen.");return}items=[];toast("Alla varor är borttagna")}
async function addDemo(){const rows=DEMO.map(d=>({name:d.name,cat:d.cat,qty:d.qty,e:d.e,exp:addDays(d.days)}));const{data,error}=await sb.from("items").insert(rows).select();if(error){toast("Något gick fel. Försök igen.");return}items=items.concat(data.map(fromRow))}

let scanner=null,busy=false;
async function stopCam(){if(scanner){try{await scanner.stop();scanner.clear()}catch(x){}scanner=null}}
async function openScan(){
busy=false;$("#scanBox").hidden=false;$("#reader").style.display="";
$("#scanMsg").textContent="Rikta kameran mot streckkoden på varan.";
try{
const F=Html5QrcodeSupportedFormats;
scanner=new Html5Qrcode("reader",{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false});
await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140}},c=>onCode(c),()=>{});
}catch(err){$("#reader").style.display="none";$("#scanMsg").textContent="Kameran kunde inte startas. Tillåt kamera för sidan i webbläsaren, eller skriv in streckkoden här under."}}
async function closeScan(){await stopCam();$("#scanBox").hidden=true}
function guess(tags){const t=tags.join(" ");
if(/dair|milk|chees|yogh|yogu|cream|butter|egg/.test(t))return"Mejeri";
if(/meat|poultry|chicken|beef|pork|sausage|fish/.test(t))return"Kött";
if(/vegetable|fruit|salad|plant-based-foods/.test(t))return"Grönsaker";
return"Annat"}
async function lookup(code){
try{const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+"?fields=product_name,product_name_sv,categories_tags,quantity");
const j=await r.json();
if(j.status===1&&j.product){const p=j.product;return{name:(p.product_name_sv||p.product_name||"").trim(),cat:guess(p.categories_tags||[]),qty:p.quantity||""}}}catch(x){}
return null}
async function onCode(code){
if(busy)return;busy=true;
$("#scanMsg").textContent="Letar efter varan…";
await stopCam();
const p=await lookup(code);
await closeScan();
st.tab="fridge";st.adding=true;st.prefill=p||{};
render();window.scrollTo(0,0);
toast(p&&p.name?"Hittade varan. Fyll i bäst före-datum.":"Hittade inte varan. Skriv in namnet själv.")}
(async()=>{
if(!sb){ready=true;render();toast("Kunde inte ladda inloggningen. Kontrollera nätverket.");return}
try{const{data}=await sb.auth.getSession();if(data.session){setUser(data.session.user);await loadItems()}}catch(x){}
ready=true;render();
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){setUser(null);items=[];render()}});
})();
</script>
</body>
</html>
